<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Định dạng văn bản</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
        }
        .full {
            color: #008000; 
            text-align: center; 
            font-size: 28px; 
            margin-top: 0; 
            margin-bottom: 25px;
        }
        .div-1 {
            border: 1px solid #3b5998; 
            width: 75%; 
            margin: 20px auto; 
            padding: 20px 30px;
        }
        .div-2 {
            background-color: #ff0000; 
            color: #00008b; 
            margin-top: 35px; 
            padding: 4px 6px; 
            font-size: 16px; 
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <div class="div-1">
        
        <h1 class="full">
            Định dạng văn bản
        </h1>

        <p style="margin: 5px 0; font-size: 16px;">
            <span style="font-weight: bold; text-decoration: underline;">Hóa học:</span> 
            <span style="font-style: italic;">Nước:</span> 
            <span style="color: red;">H<sub>2</sub>0</span>; 
            <span style="font-style: italic;">Acid Funfuric:</span> 
            <span style="color: red;">H<sub>2</sub>SO<sub>4</sub></span>
        </p>

        <p style="margin: 5px 0; font-size: 16px;">
            <span style="font-weight: bold; text-decoration: underline;">Toán học:</span> 
            <span style="font-style: italic;">Phương trình bậc 2:</span> 
            <span style="color: red;">ax<sup>2</sup>+bx+c=0</span>
        </p>

        <p style="margin: 5px 0; font-size: 16px;">
            <span style="font-weight: bold; text-decoration: underline;">Tin học:</span> 
            <span style="font-style: italic;">Vòng lặp For:</span>
        </p>

        <div class="div-2">
            For i = 0 to 10<br><span style="margin-left: 30px;">Tổng = Tổng + 1</span><br>Next
        </div>
    </div>
</body>
</html>
